name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain for the Lint job (rustfmt, Clippy, rustdoc), so new
  # lints or formatting rules in a Rust release cannot turn it red without a
  # code change. The Test job intentionally keeps running on stable to catch
  # real breakage from new compilers. Bump this deliberately (see README).
  RUST_LINT_TOOLCHAIN: "1.99.0"

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable plus the MSRV declared in Cargo.toml (rust-version)
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - run: cargo +"${{ matrix.toolchain }}" test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install "$RUST_LINT_TOOLCHAIN" --profile minimal -c clippy,rustfmt
      - run: cargo +"$RUST_LINT_TOOLCHAIN" fmt --check
      - run: cargo +"$RUST_LINT_TOOLCHAIN" clippy --all-targets -- -D warnings
      - run: cargo +"$RUST_LINT_TOOLCHAIN" doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
