name: Release

# Publishes to crates.io when a version tag (e.g. v2.0.1) is pushed,
# then creates a GitHub release with the version's CHANGELOG.md entry.
# Uses crates.io trusted publishing, so no API token is stored in GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required by crates-io-auth-action to request a token from crates.io
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, version, CHANGELOG and branch
        run: bash .github/scripts/check-release.sh
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test
      - run: cargo +stable publish --dry-run
      # The token is requested only after every check has passed,
      # and the action revokes it when the job ends
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo +stable publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub release
    # Only after the crate is on crates.io, so a release always matches a published version
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release; this job builds and runs no Rust code
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
