name: Release

# Publishes to crates.io when a version tag (e.g. v2.0.1) is pushed.
# Uses crates.io trusted publishing, so no API token is stored in GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required by crates-io-auth-action to request a token from crates.io
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, version, CHANGELOG and branch
        run: bash .github/scripts/check-release.sh
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test
      - run: cargo +stable publish --dry-run
      # The token is requested only after every check has passed,
      # and the action revokes it when the job ends
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo +stable publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
