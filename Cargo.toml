[package]
name = "rpn-reckoner"
version = "1.0.0"
edition = "2024"
authors = ["rei-ashine"]
description = "A Reverse Polish Notation library"
license = "MIT"
include = ["src/", "README.md"]
homepage = "https://github.com/rei-ashine"
repository = "https://github.com/rei-ashine/rpn-reckoner"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "doc_cfg"]

[[bin]]
name = "rpn-reckoner"
doc = false
path = "src/main.rs"